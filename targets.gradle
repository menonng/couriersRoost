ext.fabricRange = { List<String> versions ->
    versions.size() == 1 ? versions[0] : ">=${versions.first()} <=${versions.last()}".toString()
}

ext.forgeRange = { List<String> versions ->
    versions.size() == 1 ? "[${versions[0]}]".toString() : "[${versions.first()},${versions.last()}]".toString()
}

ext.mixinList = { List<String> names ->
    "[" + names.collect { "\"${it}\"" }.join(", ") + "]"
}
