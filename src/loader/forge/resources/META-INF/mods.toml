modLoader="javafml"
loaderVersion="[${forge_major},)"
license="MIT"
issueTrackerURL="https://github.com/menonng/couriersRoost/issues"

[[mods]]
modId="courierpost"
version="${version}"
displayName="Courier's Roost"
authors="menonng"
displayURL="https://modrinth.com/mod/couriers-roost"
logoFile="assets/courierpost/icon.png"
description='''Chat messages are delivered by courier chickens that fly to the recipient. Only the server needs the mod.'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.courierpost]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_major},)"
    ordering="NONE"
    side="SERVER"

[[dependencies.courierpost]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="SERVER"
