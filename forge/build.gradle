plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

def shared = rootDir.parentFile
apply from: new File(shared, 'targets.gradle')

def sharedProperties = new Properties()
new File(shared, 'gradle.properties').withInputStream { sharedProperties.load(it) }

def minecraftVersion = (project.findProperty("mc") ?: "26.3").toString()
if (!courierTargets.containsKey(minecraftVersion)) {
    throw new GradleException("Unsupported Minecraft version '${minecraftVersion}'. Supported: ${courierTargets.keySet().join(', ')}")
}
def target = courierTargets[minecraftVersion]
def forgeMajor = target.forge.tokenize('.')[0]

version = "${sharedProperties.mod_version}+${minecraftVersion}"
group = sharedProperties.maven_group

base {
    archivesName = "${sharedProperties.archives_base_name}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(target.java)

sourceSets.main {
    java.srcDirs = [new File(shared, 'src/main/java')] +
            target.layers.collect { new File(shared, "src/compat/${it}/java") } +
            [new File(shared, "src/loader/forge/${target.eventbus}/java")]
    resources.srcDirs = [new File(shared, 'src/main/resources'), new File(shared, 'src/loader/forge/resources')]
}

minecraft {
    if (target.mojmap) {
        mappings channel: 'official', version: minecraftVersion
    }
    runs {
        register('server') {
            workingDir = new File(shared, "run/forge-${minecraftVersion}")
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraftVersion}-${target.forge}")
}

processResources {
    exclude 'fabric.mod.json'
    def replacements = [
            "version"        : project.version.toString(),
            "minecraft_range": forgeRange(target.forgeCovers),
            "forge_major"    : forgeMajor,
            "java_version"   : Math.min(target.java as int, 21).toString(),
            "mixins"         : mixinList(target.mixins),
            "icon_key"       : target.pluralData ? "item" : "id",
            "pack_format"    : target.forgePack,
    ]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'courierpost.mixins.json', 'data/*/advancement/**/*.json']) {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}

jar {
    manifest {
        attributes 'MixinConfigs': 'courierpost.mixins.json'
    }
}

tasks.register("collect", Copy) {
    dependsOn tasks.named("jar")
    from(layout.buildDirectory.dir("libs")) {
        include "*.jar"
    }
    into new File(shared, "dist")
}
