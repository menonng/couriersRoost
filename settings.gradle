pluginManagement {
    def requested = startParameter.projectProperties.get("mc")
            ?: providers.gradleProperty("default_minecraft_version").getOrElse("26.2")
    def loomVersion = requested.startsWith("26.") ? "1.17.19" : "1.16.3"

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id 'fabric-loom' version loomVersion
        id 'net.fabricmc.fabric-loom' version loomVersion
    }
}

rootProject.name = 'courierpost'
