plugins {
    id 'fabric-loom' apply false
    id 'net.fabricmc.fabric-loom' apply false
}

apply from: 'targets.gradle'

def minecraftVersion = (project.findProperty("mc") ?: project.default_minecraft_version).toString()
def profile = (project.findProperty("profile") ?: minecraftVersion).toString()
if (!courierTargets.containsKey(profile)) {
    throw new GradleException("Unsupported Minecraft version '${profile}'. Supported: ${courierTargets.keySet().join(', ')}")
}
def target = new LinkedHashMap(courierTargets[profile])
if (project.hasProperty("api")) {
    target.fabricApi = project.property("api").toString()
}
if (project.hasProperty("java")) {
    target.java = project.property("java").toString().toInteger()
}
def covered = profile == minecraftVersion ? target.covers : [minecraftVersion]

apply plugin: target.mojmap ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

target.layers.each { layer ->
    sourceSets.main.java.srcDir "src/compat/${layer}/java"
}
sourceSets.main.java.srcDir "src/loader/fabric/java"

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-fabric"
}

loom {
    runs.configureEach {
        runDir = "run/${minecraftVersion}"
    }
    if (target.mojmap) {
        mixin {
            useLegacyMixinAp = false
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (target.mojmap) {
        mappings loom.layered {
            officialMojangMappings()
        }
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    }
}

processResources {
    def replacements = [
            "version"        : project.version.toString(),
            "minecraft_range": fabricRange(covered),
            "java_version"   : target.java.toString(),
            "loader_version" : target.loader,
            "mixins"         : mixinList(target.mixins),
            "icon_key"       : target.pluralData ? "item" : "id",
    ]
    inputs.properties replacements

    filesMatching(["fabric.mod.json", "courierpost.mixins.json", "data/*/advancement/**/*.json"]) {
        expand replacements
    }

    if (target.pluralData) {
        filesMatching("data/*/advancement/**") { details ->
            details.path = details.path.replaceFirst("/advancement/", "/advancements/")
        }
        includeEmptyDirs = false
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = target.java
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(target.java)
    }
    withSourcesJar()
}

tasks.register("collect", Copy) {
    dependsOn tasks.named("build")
    from(layout.buildDirectory.dir("libs")) {
        include "*.jar"
        exclude "*-sources.jar", "*-dev.jar"
    }
    into layout.projectDirectory.dir("dist")
}
